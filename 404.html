<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>E-Sertifikat Senkom</title>
    <script type="text/javascript">
      // Mengubah path sub-event menjadi query parameter secara otomatis
      var pathSegmentsToKeep = 1; // Menjaga path base '/e-sertifikat-app/'
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/") +
          (l.search ? "&" + l.search.slice(1) : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
